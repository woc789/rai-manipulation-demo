# fulfillment: one mixed order per bin; classification: legacy SKU bins.
operation_mode: fulfillment
scene_service_timeout_s: 20.0
scheduler:
  accept_timeout_s: 15.0
  feedback_timeout_s: 180.0
  result_timeout_s: 900.0
camera:
  color: /color_image5
  depth: /depth_image5
  info: /color_camera_info5
  source_frame: RGBDCamera5
  target_frame: panda_link0
aliases:
  corn: [corn cob, ear of corn, corn]
  carrot: [carrot]
  apple: [apple]
  tomato: [tomato]
zones:
  A:
    tolerance_m: 0.07
    bin_half_extents_m: [0.08, 0.08]
    bin_capacity_items: 4
    sku_bins:
      corn: 0
      carrot: 1
      apple: 2
      tomato: 3
    slots:
      - [0.50, -0.48]
      - [0.57, -0.23]
      - [0.57, 0.23]
      - [0.50, 0.48]
    slot_entities:
      - order_bin_A1
      - order_bin_A2
      - order_bin_A3
      - order_bin_A4
stock:
  initial_counts: {corn: 4, carrot: 4, apple: 4, tomato: 4}
  settle_time_s: 2.0
  # Geometric setup guardrails, NOT a substitute for MoveIt collision/IK checks.
  # Mixed stock occupies two side banks; the tight base/centre corridor is empty.
  layout:
    min_base_radius_m: 0.39
    min_center_spacing_m: 0.085
    min_bin_distance_m: 0.14
agent:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.7-flash-2026-07-15
  timeout_s: 40
  max_tool_calls_per_item: 6
  max_consecutive_empty_perceptions: 5
perception:
  service_timeout_s: 20.0
  association_radius_m: 0.065
workspace:
  x: [0.20, 0.60]
  y: [-0.55, 0.55]
  source_exclusion_radius_m: 0.08
  source_target_clearance_m: 0.12
# Conservative collision proxies in panda_link0. The O3DE world frame is
# identity-aligned with panda_link0 in workstation.launch.py. Keep these below
# the proven grasp and bin-release heights until measured geometry is available.
planning_scene:
  service_timeout_s: 12.0
  table_xy_margin_m: 0.02
  table_top_z_m: 0.01
  table_thickness_m: 0.10
  bin_floor_z_offset_m: -0.01
  bin_floor_thickness_m: 0.02
  bin_wall_thickness_m: 0.008
  bin_wall_height_m: 0.07
  # Conservative transit proxies; grasped pose comes from the verified O3DE
  # lift audit and is never shown to the Agent as a perception result.
  carried_radius_m: {corn: 0.035, carrot: 0.035, apple: 0.030, tomato: 0.030}
  # A real existing wooden-crate asset, temporarily returned on its side.
  # Collider parts below match Project/Prefabs/toy_box.prefab, not an invented solid block.
  barrier:
    kind: return_crate
    entity: route_barrier
    prefab_name: toy_box
    entities: [packing_return_crate]
    expected_pose:
      position: [0.43, 0.0, 0.11]
      orientation: [0.0, 0.7071067811865476, 0.0, 0.7071067811865476]
    collider_parts:
      - {center: [0.0, 0.0, 0.0], size: [0.20, 0.20, 0.02]}
      - {center: [0.09, 0.0, 0.06], size: [0.02, 0.20, 0.11]}
      - {center: [-0.09, 0.0, 0.06], size: [0.02, 0.20, 0.11]}
      - {center: [0.0, 0.09, 0.06], size: [0.20, 0.02, 0.11]}
      - {center: [0.0, -0.09, 0.06], size: [0.20, 0.02, 0.11]}
    proxy_padding_m: 0.005
    pose_tolerance_m: 0.018
    orientation_tolerance_rad: 0.15
    spawn_settle_time_s: 2.0
motion:
  grasp_z_offset_m: 0.10
  # Measured RGB-D centroid bias for the narrow carrot prefab in this O3DE camera.
  # These offsets adjust the visual grasp target; simulator poses are only a safety check.
  grasp_correction_m:
    carrot: [-0.024, 0.0, -0.014]
  post_grasp_lift_z_m: 0.30
  min_object_lift_m: 0.06
  lift_settle_time_s: 0.3
  place_extra_height_m: 0.05
  bin_release_z_m: 0.32
  bin_clearance_z_m: 0.40
  minimum_z_m: 0.135
  service_timeout_s: 45.0
  settle_time_s: 2.0
startup_timeout_s: 240.0
perception_timeout_s: 180.0
